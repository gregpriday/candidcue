[package]
name = "candidcue"
version = "0.1.0"
description = "CandidCue — voice-following teleprompter"
authors = ["Greg Priday"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "candidcue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "macros",
  "migrate",
] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
percent-encoding = "2"
# Decoder-level validation for imported images (spec §24.2, §50.7). Only the
# four formats the app actually renders are enabled, so this pulls in the
# format decoders and nothing else — no codecs, no rayon, no I/O helpers.
# `image` is the smallest well-maintained crate that can both read dimensions
# from a header (cheap decompression-bomb rejection) and enforce allocation
# limits during a real decode.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
] }
# The speech-to-script alignment engine. A path dependency into the standalone
# `crates/` workspace, which is deliberately NOT part of this one: the engine and
# its benchmark harness must build and run without Tauri or a WebView, because
# that is what lets `cc-bench` replay captured takes offline and makes the
# numbers in bench/REPORT.md mean anything.
cc-align = { path = "../crates/cc-align" }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
base64 = "0.23.0"
futures-util = "0.3.33"

[dev-dependencies]
tempfile = "3"
# `tauri/test` gives the MockRuntime, which is what makes it possible to assert
# that a stage command actually EMITS rather than only that its pure policy
# helper returned `Emit`. Dev-only: with resolver v2 this feature is not unified
# into a normal `cargo build`, so the shipped binary is unaffected.
tauri = { version = "2", features = ["test"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
