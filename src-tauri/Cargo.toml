[package]
name = "candidcue"
version = "0.1.0"
description = "CandidCue — voice-following teleprompter"
authors = ["Greg Priday"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "candidcue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api`: a transparent webview on a Mac, which is what lets the
# sidebar sit on the system's vibrancy (`windows/material.rs`). The private
# piece is WKWebView's `drawsBackground` key; it bars the Mac App Store, which
# this app does not ship through. Paired with `app.macOSPrivateApi` in
# tauri.conf.json — tauri-build refuses one without the other.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "macros",
  "migrate",
] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The log file a packaged build can actually be debugged from (§179). A
# Finder-launched `.app` has stdout redirected to /dev/null by launchd, so the
# subscriber needs a second sink that lands on disk; `tracing-appender` supplies
# the daily rotation and the file-count retention that go with it.
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
# Library word counts (`scripts/words.rs`) must split words exactly where the
# Markdown compiler does, and its token pattern is written in Unicode general
# categories (`\p{L}`, `\p{N}`). `char::is_alphabetic` is a different property —
# it admits combining marks the compiler splits on — so the pattern is matched
# with the same classes rather than approximated. Already in the lockfile.
regex = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Speech-model archives (§152). Upstream publishes `.tar.bz2`, so the `zip`
# crate above — which is for script export/import — has nothing to do with this.
#
# tar drops its default `xattr` feature: that reads and restores extended
# attributes, and this unpacker writes only the regular files the catalogue
# names — an archive carrying xattrs should have them ignored, not applied.
#
# bzip2 keeps its defaults, which is the whole point. `default = ["dep:libbz2-
# rs-sys"]` IS the pure-Rust backend; the C library is the opt-in `bzip2-sys`
# feature, which stays off. Turning defaults off here compiles nothing —
# neither backend is selected and the crate fails on a missing `extern crate`.
tar = { version = "0.4", default-features = false }
bzip2 = "0.6"
percent-encoding = "2"
# Decoder-level validation for imported images (spec §24.2, §50.7). Only the
# four formats the app actually renders are enabled, so this pulls in the
# format decoders and nothing else — no codecs, no rayon, no I/O helpers.
# `image` is the smallest well-maintained crate that can both read dimensions
# from a header (cheap decompression-bomb rejection) and enforce allocation
# limits during a real decode.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
] }
# The speech-to-script alignment engine. A path dependency into the standalone
# `crates/` workspace, which is deliberately NOT part of this one: the engine and
# its benchmark harness must build and run without Tauri or a WebView, because
# that is what lets `cc-bench` replay captured takes offline and makes the
# numbers in bench/REPORT.md mean anything.
cc-align = { path = "../crates/cc-align" }
# The on-device recogniser and the STT event protocol. It has no network stack
# to enable — the hosted websocket client this replaced is gone — so the shipped
# binary carries no network speech path at all.
cc-stt = { path = "../crates/cc-stt" }
base64 = "0.23.0"
tauri-plugin-single-instance = "2.4.3"
# In-app updates (docs/updates.md). Rust-only: no `updater:*` or `process:*`
# permission is granted to any webview and the JavaScript package is not
# installed, so the only way to check or install is through the two commands in
# `commands/update_cmds.rs`, which `updater.rs` gates. Default features on
# purpose: `zip` is what lets a Linux AppImage or a Windows installer arrive
# compressed as well as raw, and `system-proxy` is what lets a check work on a
# network that only reaches the internet through the system's proxy.
#
# Pinned to 2.12.x with `~`, not left at "2": 2.13 and later require tauri
# 2.12, and letting cargo resolve one silently upgrades tauri, wry and muda
# underneath the whole app (and moves webview2-com off the 0.38 pinned below).
# Move this with a deliberate tauri upgrade, not before.
tauri-plugin-updater = "~2.12.0"
libc = "0.2.189"

# `CGDisplayScreenSize`: the panel's EDID size in millimetres, which is what
# lets a take be sized for a monitor nobody has calibrated
# (`windows/panel_size.rs`). Already in the tree through tao; named here so the
# call is explicit rather than riding on a transitive version.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
# The sidebar material under the desk's windows (`windows/material.rs`). The
# version tauri itself already links, so the app carries one copy.
window-vibrancy = "0.6"
# The unified titlebar the traffic lights centre in, over the page's toolbar
# band (`windows/material.rs`), and the name each display goes by in System
# Settings (`windows/panel_size.rs`). All three already in the tree at these
# versions, through tao and window-vibrancy.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSString",
  "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSGraphics",
  "NSResponder",
  "NSScreen",
  "NSToolbar",
  "NSWindow",
] }

# The WebView2 COM surface, for the one event wry does not expose: granting the
# app's own pages the microphone (`windows/webview_microphone.rs`). Both are
# already in the tree through wry at these versions; named here so the handler
# types are the same ones wry's controller hands back.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
# Mica under the desk's windows, through DWM's documented system backdrop with
# its result checked, and the build number that says whether this Windows has
# it (`windows/material.rs`). Both already in the tree at these versions, the
# first through tauri; `Win32_Graphics_Dwm` is the one feature added.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
windows-version = "0.1"

# Linux. All three are already in the tree at these versions — wry, tao and muda
# bring GTK and WebKitGTK, and the single-instance plugin brings zbus — so naming
# them compiles nothing new; it makes the calls explicit:
#   - webkit2gtk: the microphone, which WebKitGTK refuses by default
#     (`windows/webview_microphone.rs`). `v2_24` is the oldest API used
#     (`DeviceInfoPermissionRequest`); wry already asks for `v2_38`.
#   - gtk: the panel's size in millimetres from GDK (`windows/panel_size.rs`)
#     and fullscreen on a chosen monitor (`windows/present.rs`).
#   - zbus: holding the display awake through the session's ScreenSaver
#     service (`windows/sleep.rs`).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_24"] }
gtk = "0.18"
zbus = "5"

[dev-dependencies]
tempfile = "3"
# `tauri/test` gives the MockRuntime, which is what makes it possible to assert
# that a stage command actually EMITS rather than only that its pure policy
# helper returned `Emit`. Dev-only: with resolver v2 this feature is not unified
# into a normal `cargo build`, so the shipped binary is unaffected.
tauri = { version = "2", features = ["test"] }
# The parser Tauri hands every menu accelerator to. Tauri discards its error and
# builds the item with no key, so the only place a misspelt accelerator can fail
# is a test that parses it the same way (`menu.rs`). Already in the tree through
# tauri at the same version; no default features, so it unifies to tauri's set.
muda = { version = "0.19", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
