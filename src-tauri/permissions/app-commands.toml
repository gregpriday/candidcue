# CandidCue application-command ACL (spec §49, §50.2).
#
# The mere existence of an app-level permission file is what switches Tauri's
# ACL gate ON for application commands. Without it,
# `RuntimeAuthority::has_app_manifest()` is false and tauri/src/webview/mod.rs
# skips the check entirely for any LOCAL webview — which means the stage
# window could invoke every command in `generate_handler!`, including secret
# storage and permanent deletion (C2).
#
# This permission is granted to the `control` capability ONLY. The stage
# window (spec §43.2, §50.2) is minimally privileged and must have no custom
# commands at all; it communicates exclusively over the event channels listed
# in capabilities/stage.json.
#
# Adding a command to `generate_handler!` without adding it here fails closed:
# control gets "not allowed by ACL" rather than the stage silently gaining
# access. `app_commands_permission_matches_generate_handler` in
# tests/acl_tests.rs asserts the two lists stay in sync.

[[permission]]
identifier = "allow-control-commands"
description = "Every CandidCue application command. Granted to the control window only."
commands.allow = [
  "app_version",
  "list_scripts",
  "create_script",
  "get_script",
  "save_script",
  "rename_script",
  "duplicate_script",
  "trash_script",
  "restore_script",
  "permanently_delete_script",
  "list_revisions",
  "get_revision",
  "restore_revision",
  "import_script",
  "export_script",
  "reveal_script_folder",
  "import_image",
  "import_remote_image",
  "resolve_asset_urls",
  "remove_asset_reference",
  "validate_inworld_key",
  "save_inworld_key",
  "get_inworld_key_status",
  "delete_inworld_key",
  "test_inworld_key",
  "start_transcription",
  "push_transcription_audio",
  "stop_transcription",
  "start_alignment",
  "stop_alignment",
  "set_alignment_position",
  "log_client_diagnostic",
  "list_displays",
  "identify_displays",
  "open_stage",
  "close_stage",
  "set_stage_fullscreen",
  "publish_stage_document",
  "publish_stage_command",
  "get_stage_status",
  "save_display_profile",
  "list_display_profiles",
  "get_settings",
  "update_settings",
  "export_all_data",
  "clear_cache",
  "get_system_diagnostics",
  "export_support_bundle",
  "check_for_update",
  "install_update",
  "start_session",
  "end_session",
  "append_session_transcript",
  "list_sessions",
  "record_session_take",
  "list_session_takes",
]
