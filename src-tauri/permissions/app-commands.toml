# CandidCue application-command ACL (spec §49, §50.2).
#
# The mere existence of an app-level permission file is what switches Tauri's
# ACL gate ON for application commands. Without it,
# `RuntimeAuthority::has_app_manifest()` is false and tauri/src/webview/mod.rs
# skips the check entirely for any LOCAL webview — which means the stage
# window could invoke every command in `generate_handler!`, including secret
# storage and permanent deletion (C2).
#
# This permission is granted to the `control` capability and, deliberately, to
# `preferences` — Settings is where the model is downloaded, displays are
# identified, rigs are calibrated and backups are written, and narrowing it
# would mean a second list that fails as a broken screen every time a setting
# gains a backing command. capabilities/preferences.json states the tradeoff in
# full: the grant really is as wide as control's, script deletion and session
# commands included, and it is accepted as such.
#
# What it is NOT granted to is the stage. That window (spec §43.2, §50.2) is
# minimally privileged and must have no custom commands at all; it communicates
# exclusively over the event channels listed in capabilities/stage.json.
#
# Adding a command to `generate_handler!` without adding it here fails closed:
# control gets "not allowed by ACL" rather than the stage silently gaining
# access. `app_commands_permission_matches_generate_handler` in
# tests/acl_tests.rs asserts the two lists stay in sync.

[[permission]]
identifier = "allow-control-commands"
description = "Every CandidCue application command. Granted to the control and preferences windows; withheld from the stage."
commands.allow = [
  "app_version",
  "list_scripts",
  "create_script",
  "get_script",
  "save_script",
  "rename_script",
  "duplicate_script",
  "trash_script",
  "restore_script",
  "permanently_delete_script",
  "list_revisions",
  "get_revision",
  "restore_revision",
  "import_script",
  "export_script",
  "reveal_script_folder",
  "import_image",
  "open_model_licence",
  "resolve_asset_urls",
  "remove_asset_reference",
  "get_speech_engine_status",
  "preload_speech_engine",
  "start_transcription",
  "push_transcription_audio",
  "stop_transcription",
  "get_speech_model_status",
  "start_speech_model_download",
  "cancel_speech_model_download",
  "delete_speech_model",
  "get_speech_language_options",
  "select_speech_language",
  "start_alignment",
  "stop_alignment",
  "set_alignment_position",
  "reacquire_alignment",
  "log_client_diagnostic",
  "list_displays",
  "current_window_display",
  "identify_displays",
  "open_stage",
  "close_stage",
  "set_stage_fullscreen",
  "set_control_presenting",
  "publish_stage_document",
  "publish_stage_command",
  "get_stage_status",
  "save_display_profile",
  "list_display_profiles",
  "get_settings",
  "update_settings",
  "export_all_data",
  "restore_all_data",
  # Recovery (§48.5). Reachable because a failed `database::init` no longer
  # aborts Tauri's setup hook before a webview exists.
  "get_boot_status",
  "list_database_backups",
  "restore_database_backup",
  "rebuild_database_index",
  "rescue_scripts",
  "reveal_data_folder",
  "write_unsaved_recovery",
  "get_startup_findings",
  "clear_cache",
  "get_system_diagnostics",
  "export_support_bundle",
  # Reveals the bundle THIS process last wrote, in Finder. It takes no path —
  # see `LastSupportBundle` — so it cannot be pointed at another directory.
  "reveal_support_bundle",
  # Desktop shell (refinement §5, §6). Two one-way pushes of state the frontend
  # already owns — the native menu's enabled/checked flags and the window title
  # — plus one reveal that names exactly the directory it opens. None of them
  # read anything back, so none can be used to learn a path the caller did not
  # already have.
  #
  # The resting window frame is deliberately NOT here. Rust records it from its
  # own Moved/Resized events (app.rs); exposing a command for it would have
  # widened the ACL for something no caller wanted.
  "set_menu_state",
  "set_window_title",
  # A SCRIPT ID, not a path — the repository resolves it itself, so this is the
  # same contract `import_image` has always had.
  "set_drop_target_script",
  # Window management for the Settings window (§14.1). Creating and closing a
  # window neither reads nor writes anything the caller could not already see.
  "open_preferences",
  "close_preferences",
  # File › Close Window. Takes no argument: Rust closes the CALLING window and
  # refuses any caller but control, so the shared grant does not let Settings
  # quit the app (shell_cmds.rs).
  "close_control_window",
  "focus_app_window",
  "reveal_logs",
  # Opens a file this build shipped, resolved by Rust. Takes no argument.
  "open_third_party_notices",
  # Help's web destinations. This is deliberately NOT `opener:default`: the
  # argument is a NAME, and src/web.rs maps the five names it knows to fixed
  # pages of one compile-time repository. The webview cannot express a url.
  "open_web_destination",
  # No "check_for_update" / "install_update": CandidCue 1.0 updates manually
  # (docs/updates.md). Both were permitted here while always returning
  # NOT_IMPLEMENTED, which left an updater's ACL surface pre-approved.
  "start_session",
  "end_session",
  "list_sessions",
  # No "append_session_transcript" / "record_session_take" /
  # "list_session_takes": take history and retained transcripts were removed
  # with their storage (#217).
]
