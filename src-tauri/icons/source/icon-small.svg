<?xml version="1.0" encoding="UTF-8"?>
<!--
  The CandidCue app icon at 16 and 32 px, drawn on a 32-unit grid rather than
  shrunk from icon.svg: three lines where the master has five (the read line
  above, the current line, the waiting line below), a thinner margin, no shadow
  and no gradient, and every line edge on an even unit, so each line lands on
  whole pixels at 16 px as well as 32 — the current line two rows at 16 px, the
  read and waiting lines one each, brighter than the master's so a single row
  survives. The ticks
  keep the stage triangle's proportions and stay clear of both the current
  line and the tile's outermost pixel column, so at 16 px they neither fuse
  with the line into one bar nor bite a notch out of the tile's silhouette.
-->
