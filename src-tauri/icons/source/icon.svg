<!--
  The CandidCue app icon, master artwork (1024 x 1024, the macOS icon grid).

  The line you are reading, bright, between the two cue arrows the stage draws
  beside it on the glass; the line already read above it, dimmed, and the next
  one below, waiting. It is the product's own picture of "keeping your place".

  Body: an 824px continuous-corner square inset 100px, in the app accent (#b35a38),
  with a soft drop shadow baked in, as macOS expects of a flat .icns. Small
  sizes (16 and 32 px) come from icon-small.svg, drawn for that size rather
  than shrunk. Regenerate every bundled size with scripts/build-icons.sh.
-->
