<?xml version="1.0" encoding="UTF-8"?>
<!--
  The app icon, master artwork (1024 x 1024, the macOS icon grid).

  The mark from mark.svg, its path copied verbatim, in white on the petrol
  tile: a pane of teleprompter glass in perspective, the line being read, and
  the two cue triangles the stage draws beside that line, grown out of the
  pane's edges so the glass itself points at your place.

  Body: an 824px continuous-corner square inset 100px, lit from above
  (#25747e to #06636d). The mark is 640 wide, centred 8px above the tile's
  centre. A soft drop shadow is baked into the margin, as macOS expects of a
  flat .icns; build-icons.sh removes it, and the margin, for Windows. Sizes up
  to 48 px come from sizes/, drawn for their pixel grid rather than shrunk
  (scripts/fit-icon-sizes.py). Regenerate every bundled size with
  scripts/build-icons.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="petrol" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25747e"/>
      <stop offset="1" stop-color="#06636d"/>
    </linearGradient>
    <!-- Shadow only: the tile is drawn over it unfiltered, because librsvg runs
         filters in linearRGB at 8 bits, which crushed the gradient's dark red
         channel into four visible bands when the tile went through the filter. -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="10" result="blur"/>
      <feFlood flood-color="#000" flood-opacity="0.26"/>
      <feComposite in2="blur" operator="in"/>
    </filter>
  </defs>
