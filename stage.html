<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      M2 — the stage's own Content-Security-Policy (spec §43.2, §50.10).

      Tauri applies ONE global CSP (tauri.conf.json app.security.csp) to every
      window, and that policy has to allow `https://api.openai.com` because the
      control window talks to the provider. The stage inherited it, which
      directly contradicted its no-network requirement: the minimally
      privileged window that renders the operator's script was permitted to
      open a connection to a third party.

      CSP policies compose restrictively — when a document carries both a
      header policy and a meta policy, a request has to satisfy BOTH. So this
      tag cannot loosen anything; it can only take the stage's network reach
      away, which is exactly what it does. `connect-src` here lists only the
      Tauri IPC channels (`ipc:` on Linux/macOS, `http://ipc.localhost` on
      Windows) that the event bridge needs; there is no provider origin and no
      wildcard. `worker-src` is 'none' because the workers all live in control.

      Keep this in sync with the global policy: anything the stage genuinely
      needs must be allowed by both, and the `stage_csp_grants_no_network`
      test in src-tauri/src/windows/mod.rs pins the network part.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' asset:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' asset: blob: data:; media-src 'self' asset: blob:; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost; worker-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>CandidCue Stage</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/stage/main.ts"></script>
  </body>
</html>
