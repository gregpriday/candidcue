name: Release (Windows)

# Per-OS release workflow — see release-macos.yml for the rationale and the
# rules all three share. Windows owns `windows-x86_64` on the update feed and
# `windows` on the downloads feed; nothing it uploads can touch macOS or Linux.
#
# The Windows build is NOT code-signed: SmartScreen warns on first run until
# the download has reputation. What IS signed is every update: the installer
# carries a minisign signature over its bytes, and an installed copy refuses
# any update that does not verify against the key it shipped with.
#
# The recogniser links a TTS-free sherpa-onnx build here
# (`scripts/sherpa-no-tts.mjs`): MSVC keeps C++ static initialisers as roots,
# so the stock archive's eSpeak NG and ucd-tools (GPL-3.0) would reach the
# binary. `verify-no-gpl-in-binary.mjs` asks the linked executable.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and inspect, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.run_id || 'release' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: Gates
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # A tag on an unmerged commit would otherwise publish whatever it
      # points at. Releases come from main (docs/release-runbook.md).
      - name: The tag must be on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main. Merge it to main, then tag the merge."
            exit 1
          fi

      - name: The tag must name the version being built
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version.mjs tag "${GITHUB_REF_NAME}"

      - name: The release must be described
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" --check

      - name: Completeness, versions and the native licence review
        run: >
          node scripts/release-verify.mjs
          --only='repository completeness,version sync,native licence review'

  # The same suites as ci.yml's windows job, against the TTS-free recogniser
  # that ships: the Windows-only code paths (`cfg(windows)` FFI, the WebView2
  # microphone grant, the window chrome and menu arms) only compile here.
  test:
    name: Tests and Clippy (Windows)
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            crates

      - name: Drop the empty sherpa-onnx downloads the cache restores
        shell: bash
        run: rm -rf src-tauri/target/sherpa-onnx-prebuilt crates/target/sherpa-onnx-prebuilt

      - name: The TTS-free recogniser libraries
        shell: bash
        run: node scripts/sherpa-no-tts.mjs --target win-x64 --dest "$RUNNER_TEMP/sherpa-no-tts"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, both vitest projects, both Rust workspaces and Clippy
        run: >
          node scripts/release-verify.mjs
          --only='typecheck,node tests,dom tests,rust tests (app),rust tests (alignment),clippy (app),clippy (alignment)'

  build:
    name: Build and verify (Windows x64)
    needs: [gates, test]
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Drop the empty sherpa-onnx download the cache restores
        shell: bash
        run: rm -rf src-tauri/target/sherpa-onnx-prebuilt

      - name: The TTS-free recogniser libraries
        shell: bash
        run: node scripts/sherpa-no-tts.mjs --target win-x64 --dest "$RUNNER_TEMP/sherpa-no-tts"

      - run: pnpm install --frozen-lockfile

      # Not `third-party notices`: that file is generated and checked on
      # macOS (release-macos.yml), where cargo's answer for every release
      # target is the complete one. See generate-notices.mjs.
      - name: The configuration the bundle is built from
        run: >
          node scripts/release-verify.mjs
          --only='production frontend build,supply chain,no model weights'

      - name: Build the installer
        shell: bash
        env:
          # `tauri build` exits 0 and writes no .sig at all when these are
          # missing; `release-feed.mjs stage` refuses that.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # NSIS only: the per-user installer is the Windows download AND the
          # updater payload. The updater artifacts are switched on here rather
          # than in tauri.conf.json, so builds without the key still bundle.
          pnpm tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: No GPL code may reach the binary
        shell: bash
        run: node scripts/verify-no-gpl-in-binary.mjs src-tauri/target/release/speaking-glass.exe

      # The installer installs, the app it installs starts and stays up, and
      # the uninstaller removes it. Nothing here hears a voice.
      - name: Smoke test the installer
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer exited with $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Speaking Glass'
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw "no application executable under $dir" }
          Write-Output "installed: $($exe.FullName)"
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 25
          if ($app.HasExited) { throw "Speaking Glass exited within 25 s of launch (exit $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force
          Write-Output 'Speaking Glass stayed up for 25 s'
          $uninstall = Get-ChildItem $dir -Filter 'uninstall*.exe' | Select-Object -First 1
          if ($uninstall) { Start-Process -FilePath $uninstall.FullName -ArgumentList '/S' -Wait }

      - name: Stage the release
        shell: bash
        env:
          SPEAKING_GLASS_PUBLIC_URL: ${{ vars.SPEAKING_GLASS_PUBLIC_URL }}
        run: |
          set -euo pipefail
          TAG="v$(node scripts/version.mjs print)"
          node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          node scripts/release-feed.mjs stage --os windows \
            --bundle src-tauri/target/release/bundle \
            --out handover/stage --notes "$RUNNER_TEMP/notes.md"
          (cd handover/stage/files/*/ && sha256sum -c SHA256SUMS-windows.txt)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: speaking-glass-release-windows
          # The PARENT of stage/: an artifact holds what is under its path,
          # and publishing reads stage/release.json from the artifact's root.
          path: handover/
          retention-days: 90
          if-no-files-found: error

      # What the publish job will download, downloaded and checked here, so
      # a dry run proves the handover and not only the upload.
      - uses: ./.github/actions/receive-speaking-glass
        with:
          artifact_name: speaking-glass-release-windows
          path: handover-check

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    permissions:
      contents: write
    # One publish per platform at a time, across tags: two versions both
    # passing the monotonic gate against the same live feed would otherwise
    # race, and the older could land last.
    concurrency:
      group: publish-speaking-glass-windows
      cancel-in-progress: false
    environment:
      name: ${{ contains(github.ref_name, '-') && 'release-prerelease' || 'release-stable' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/publish-speaking-glass
        with:
          artifact_name: speaking-glass-release-windows
          public_url: ${{ vars.SPEAKING_GLASS_PUBLIC_URL }}
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_endpoint: ${{ secrets.R2_ENDPOINT }}
          r2_bucket: ${{ secrets.SPEAKING_GLASS_R2_BUCKET }}
          github_token: ${{ github.token }}
