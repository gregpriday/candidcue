name: Release (Linux)

# Per-OS release workflow — see release-macos.yml for the rationale and the
# rules all three share. Linux owns `linux-x86_64` on the update feed and
# `linux` on the downloads feed; nothing it uploads can touch macOS or Windows.
#
# Two packages: an AppImage, which is also the updater payload (an installed
# AppImage replaces itself), and a .deb for people who want the package
# manager to own the install. Built on Ubuntu 22.04 so the binaries run on
# every distribution with that glibc or newer.
#
# Like Windows, the recogniser links a TTS-free sherpa-onnx build here
# (`scripts/sherpa-no-tts.mjs`), because GNU ld keeps C++ static initialisers
# as roots and the stock archive's GPL-3.0 eSpeak NG would reach the binary.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and inspect, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-linux-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.run_id || 'release' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # What Tauri 2 needs to compile and bundle on Ubuntu 22.04 (ci.yml's linux
  # job says why each is there), and bzip2 for the recogniser archive.
  LINUX_BUILD_PACKAGES: >-
    build-essential pkg-config file xdg-utils patchelf bzip2
    libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev librsvg2-dev
  # The AppImage bundler's tools are AppImages themselves; extract-and-run
  # spares them a FUSE mount the runner may not offer.
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  gates:
    name: Gates
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # A tag on an unmerged commit would otherwise publish whatever it
      # points at. Releases come from main (docs/release-runbook.md).
      - name: The tag must be on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main. Merge it to main, then tag the merge."
            exit 1
          fi

      - name: The tag must name the version being built
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version.mjs tag "${GITHUB_REF_NAME}"

      - name: The release must be described
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" --check

      - name: Completeness, versions and the native licence review
        run: >
          node scripts/release-verify.mjs
          --only='repository completeness,version sync,native licence review'

  test:
    name: Tests and Clippy (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_PACKAGES

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            crates

      - name: Drop the empty sherpa-onnx downloads the cache restores
        run: rm -rf src-tauri/target/sherpa-onnx-prebuilt crates/target/sherpa-onnx-prebuilt

      - name: The TTS-free recogniser libraries
        run: node scripts/sherpa-no-tts.mjs --target linux-x64 --dest "$RUNNER_TEMP/sherpa-no-tts"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, both vitest projects, both Rust workspaces and Clippy
        run: >
          node scripts/release-verify.mjs
          --only='typecheck,node tests,dom tests,rust tests (app),rust tests (alignment),clippy (app),clippy (alignment)'

  build:
    name: Build and verify (Linux x64)
    needs: [gates, test]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_PACKAGES xvfb

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Drop the empty sherpa-onnx download the cache restores
        run: rm -rf src-tauri/target/sherpa-onnx-prebuilt

      - name: The TTS-free recogniser libraries
        run: node scripts/sherpa-no-tts.mjs --target linux-x64 --dest "$RUNNER_TEMP/sherpa-no-tts"

      - run: pnpm install --frozen-lockfile

      # Not `third-party notices`: that file is generated and checked on
      # macOS (release-macos.yml), where cargo's answer for every release
      # target is the complete one. See generate-notices.mjs.
      - name: The configuration the bundle is built from
        run: >
          node scripts/release-verify.mjs
          --only='production frontend build,supply chain,no model weights'

      - name: Build the AppImage and the .deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm tauri build --bundles appimage,deb --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: No GPL code may reach the binary
        run: node scripts/verify-no-gpl-in-binary.mjs src-tauri/target/release/speaking-glass

      # Both packages install and start on a display-less runner, under Xvfb.
      # The .deb goes through apt, which proves its dependency list; the
      # AppImage runs extracted, because runners have no FUSE.
      - name: Smoke test both packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/release/bundle
          # A session bus, as a desktop has: single-instance and the
          # display-sleep inhibitor both talk D-Bus. Xvfb has no GPU.
          export LIBGL_ALWAYS_SOFTWARE=1
          smoke() {
            local label="$1"; shift
            dbus-run-session -- xvfb-run -a "$@" > "$RUNNER_TEMP/smoke-$label.log" 2>&1 &
            local pid=$!
            sleep 25
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::the $label build exited within 25 s of launch"
              cat "$RUNNER_TEMP/smoke-$label.log"
              exit 1
            fi
            kill "$pid" || true
            wait "$pid" 2>/dev/null || true
            echo "$label stayed up for 25 s"
          }
          # Tauri names the package after the product, space and all
          # (`Speaking Glass_<version>_amd64.deb`). apt is handed a copy at a
          # plain path rather than trusted to parse that one.
          DEB="$RUNNER_TEMP/speaking-glass.deb"
          cp "$(ls "$BUNDLE"/deb/*.deb)" "$DEB"
          PKG="$(dpkg-deb -f "$DEB" Package)"
          sudo apt-get install -y --no-install-recommends "$DEB"
          BIN="$(dpkg -L "$PKG" | grep -E '^/usr/bin/' | head -1)"
          smoke deb "$BIN"
          sudo apt-get remove -y "$PKG"
          APPIMAGE="$(ls "$BUNDLE"/appimage/*.AppImage)"
          chmod +x "$APPIMAGE"
          smoke appimage "$APPIMAGE" --appimage-extract-and-run

      - name: Stage the release
        env:
          SPEAKING_GLASS_PUBLIC_URL: ${{ vars.SPEAKING_GLASS_PUBLIC_URL }}
        run: |
          set -euo pipefail
          TAG="v$(node scripts/version.mjs print)"
          node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          node scripts/release-feed.mjs stage --os linux \
            --bundle src-tauri/target/release/bundle \
            --out handover/stage --notes "$RUNNER_TEMP/notes.md"
          (cd handover/stage/files/*/ && sha256sum -c SHA256SUMS-linux.txt)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: speaking-glass-release-linux
          # The PARENT of stage/: an artifact holds what is under its path,
          # and publishing reads stage/release.json from the artifact's root.
          path: handover/
          retention-days: 90
          if-no-files-found: error

      # What the publish job will download, downloaded and checked here, so
      # a dry run proves the handover and not only the upload.
      - uses: ./.github/actions/receive-speaking-glass
        with:
          artifact_name: speaking-glass-release-linux
          path: handover-check

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    permissions:
      contents: write
    # One publish per platform at a time, across tags: two versions both
    # passing the monotonic gate against the same live feed would otherwise
    # race, and the older could land last.
    concurrency:
      group: publish-speaking-glass-linux
      cancel-in-progress: false
    environment:
      name: ${{ contains(github.ref_name, '-') && 'release-prerelease' || 'release-stable' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/publish-speaking-glass
        with:
          artifact_name: speaking-glass-release-linux
          public_url: ${{ vars.SPEAKING_GLASS_PUBLIC_URL }}
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_endpoint: ${{ secrets.R2_ENDPOINT }}
          r2_bucket: ${{ secrets.SPEAKING_GLASS_R2_BUCKET }}
          github_token: ${{ github.token }}
