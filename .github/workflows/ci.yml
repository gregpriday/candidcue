name: CI

# The tree had no CI at all before the 1.0 readiness pass. Every claim about
# what passes was a claim about somebody's laptop, which is exactly what made
# the release un-certifiable.
#
# Every step below is named OUT OF the release plan in
# `scripts/release-verify.mjs` via `--only=`, rather than hand-copied. CI wants
# these in parallel jobs and the release wants them in one ordered pass; naming
# them from the same list is what stops the two definitions drifting.
# `tests/integration/release-gates.test.ts` asserts that every step in the plan
# is claimed by some job in this file, so a step added to the plan without a
# home here fails a test rather than quietly never running.
#
# The one deliberate difference from a release run is the native licence
# review, which refuses while any statically linked native component in
# `sbom/native-components.json` is unreviewed. Confirming a licence is a job
# for a person, and blocking every push on it would train people to ignore a
# red CI, so no job here names that step. It is marked `releaseOnly` in the
# plan, and the same test asserts this file keeps not naming it — a tagged
# release runs the whole plan and cannot get past it.
#
# Gitflow: `develop` is the integration branch, and every pull request merges
# there. `main` moves only when a release merges `develop` into it, and the
# `v*` tag goes on that merge. Both get a push run, so the commit a release is
# tagged from has its own green check rather than borrowing develop's.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository, and saying so is cheaper than relying
# on the organisation default staying read-only. Every job below runs a large
# amount of third-party code — the whole dependency tree, twice over — and none
# of it needs the ability to push a commit or move a tag.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The alignment engine is deterministic and the suites are chatty; a backtrace
  # on a CI-only failure is usually the whole investigation.
  RUST_BACKTRACE: 1

jobs:
  # Seconds, not minutes. A missing input or a version drift should never cost
  # a full build to discover, and this job gates the expensive ones.
  gates:
    name: Repository gates
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The benchmark corpus is Git LFS. Without this the fixtures are
          # ~130-byte pointers and a benchmark run finds no events rather than
          # failing loudly — see bench/README.md.
          lfs: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Completeness and versions
        run: node scripts/release-verify.mjs --only='repository completeness,version sync'

  frontend:
    name: Frontend (typecheck, node, dom)
    runs-on: macos-15
    needs: gates
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # No version here: `packageManager` in package.json is the one source,
          # and a second number would be a second thing that can drift.
          run_install: false

      - name: Install with the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck and both vitest projects
        run: >
          node scripts/release-verify.mjs
          --only='typecheck,node tests,dom tests'

  browser:
    name: Browser journeys
    runs-on: macos-15
    needs: gates
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Playwright
        run: node scripts/release-verify.mjs --only='browser journeys'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: .playwright/
          retention-days: 7

  rust:
    name: Rust (${{ matrix.workspace }})
    runs-on: macos-15
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two workspaces on purpose: the alignment core builds without Tauri
          # or a WebView, and keeping that true is a property worth testing.
          - workspace: app
            cache: src-tauri
            steps: rust tests (app),clippy (app)
          - workspace: alignment
            cache: crates
            steps: rust tests (alignment),clippy (alignment)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install the pinned toolchain
        # rust-toolchain.toml pins an exact compiler; rustup honours it, so
        # naming a version here as well would create a second source of truth.
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.cache }}

      # rust-cache keeps every directory under target/ but deletes every file
      # outside a Cargo profile, so it restores sherpa-onnx-sys's unpacked
      # download as an empty `sherpa-onnx-prebuilt/<archive>/lib` folder. The
      # crate's build script takes any lib folder that exists as already
      # unpacked, so the first time a dependency change reruns it, it links
      # against nothing: "could not find native static library
      # `sherpa-onnx-c-api`". Without the folder it fetches the archive again,
      # exactly as it does on a cold cache.
      - name: Drop the empty sherpa-onnx download the cache restores
        run: rm -rf '${{ matrix.cache }}/target/sherpa-onnx-prebuilt'

      - name: Tests and Clippy
        run: node scripts/release-verify.mjs --only='${{ matrix.steps }}'

  # Proves the thing a green test suite has repeatedly failed to prove here:
  # that the application actually bundles.
  bundle:
    name: Unsigned bundle
    runs-on: macos-15
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # The same empty folder as in the Rust job; see the comment there.
      - name: Drop the empty sherpa-onnx download the cache restores
        run: rm -rf src-tauri/target/sherpa-onnx-prebuilt

      - run: pnpm install --frozen-lockfile

      - name: Frontend build and bundle-config model check
        run: >
          node scripts/release-verify.mjs
          --only='production frontend build,supply chain,third-party notices,no model weights'

      - name: Build the .app
        # `--bundles app` produces the application bundle without spending the
        # extra minutes on a DMG. Signing and notarisation need credentials and
        # live in the release workflow; this proves the artifact assembles.
        run: pnpm tauri build --bundles app

      - name: The built bundle must contain no speech-model weights
        # The configuration check above says the CONFIG declares no model
        # resources. This walks the actual payload, which is the half that
        # catches a build script rather than a config edit. The installer ships
        # zero model bytes by design (§152) — the recogniser is downloaded
        # in-app — and ~161 MB of ONNX appearing here would change the size,
        # the licensing story and the privacy copy of the artifact at once.
        run: >
          node scripts/verify-no-model-weights.mjs
          src-tauri/target/release/bundle/macos/CandidCue.app

  # Windows, end to end: the same suites, on the platform where the Windows-only
  # code paths (`cfg(windows)` FFI, the WebView2 microphone grant, the window
  # chrome and menu arms) actually compile — Clippy on macOS never sees them —
  # and where the filesystem refuses what macOS allows (renaming an open file,
  # flushing a read-only handle). Then the installer, unsigned, to prove it
  # assembles. Line endings are pinned by `.gitattributes`, so the checkout is
  # LF here too.
  windows:
    name: Windows (tests, Clippy, installer)
    runs-on: windows-2025
    needs: gates
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            crates

      # The same empty folder the macOS Rust job drops; see the comment there.
      - name: Drop the empty sherpa-onnx downloads the cache restores
        shell: bash
        run: rm -rf src-tauri/target/sherpa-onnx-prebuilt crates/target/sherpa-onnx-prebuilt

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, both vitest projects, both Rust workspaces and Clippy
        run: >
          node scripts/release-verify.mjs
          --only='typecheck,node tests,dom tests,rust tests (app),rust tests (alignment),clippy (app),clippy (alignment)'

      - name: Build the installer
        # NSIS only: the per-user installer is the Windows artifact, and an MSI
        # would spend minutes proving the same compile again.
        run: pnpm tauri build --bundles nsis

  # Linux, end to end, on the same terms as Windows: the suites and Clippy where
  # the Linux arms (`cfg(target_os = "linux")` — the WebKitGTK microphone grant,
  # fullscreen on the prompter's monitor, the session-bus sleep inhibitor, GDK's
  # panel sizes) actually compile, then both packages, unsigned. Ubuntu 22.04
  # on purpose: the packages link the glibc and WebKitGTK 4.1 of the oldest
  # distribution they are meant to install on, and run on newer ones.
  linux:
    name: Linux (tests, Clippy, deb and AppImage)
    runs-on: ubuntu-22.04
    needs: gates
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - name: Install the WebKitGTK build dependencies
        # What Tauri 2 needs to compile and bundle on Ubuntu 22.04, and nothing
        # it does not: no tray (so no appindicator), no OpenSSL (reqwest is
        # rustls), no libxdo (muda's xdo feature is off). `file`, `xdg-utils`
        # and `patchelf` are the AppImage bundler's: it copies `xdg-open` into
        # the image, and its GStreamer plugin rewrites the bundled plugins'
        # rpaths.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file xdg-utils patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev librsvg2-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            crates

      # The same empty folder the macOS Rust job drops; see the comment there.
      - name: Drop the empty sherpa-onnx downloads the cache restores
        run: rm -rf src-tauri/target/sherpa-onnx-prebuilt crates/target/sherpa-onnx-prebuilt

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, both vitest projects, both Rust workspaces and Clippy
        run: >
          node scripts/release-verify.mjs
          --only='typecheck,node tests,dom tests,rust tests (app),rust tests (alignment),clippy (app),clippy (alignment)'

      - name: Build the .deb and the AppImage
        # The two formats `tauri.linux.conf.json` names. The AppImage carries its
        # own GStreamer (`bundleMediaFramework`), which is what opens the
        # microphone inside WebKitGTK. The bundler's tools are AppImages
        # themselves; extract-and-run spares them a FUSE mount the runner may
        # not offer.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: pnpm tauri build --bundles deb,appimage
