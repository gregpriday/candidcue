[package]
name = "cc-stt"
version = "0.1.0"
description = "Tauri-free Grok (xAI) streaming STT client — same wire protocol as src-tauri/src/stt"
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
base64 = "0.23"

[dev-dependencies]
# The probe example builds without cc-bench's dependency graph, which is what
# normally selects a rustls crypto provider. Pinned to the same version so the
# feature unification picks `ring` rather than leaving none enabled.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
