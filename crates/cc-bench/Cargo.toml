[package]
name = "cc-bench"
version = "0.1.0"
description = "CandidCue alignment benchmark harness: fixtures, fal.ai TTS, on-device capture, offline replay, metrics"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cc-align = { path = "../cc-align" }
cc-stt = { path = "../cc-stt" }
serde = { workspace = true }
serde_json = { workspace = true }
# Only what is left after the async capture path went: a runtime for the TTS
# calls in `tts.rs`, and `time` for its retry backoff.
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
num2words = "1.2.0"

[dev-dependencies]
tempfile = "3.27.0"
